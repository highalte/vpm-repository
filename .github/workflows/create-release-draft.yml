name: Create VRCAM v0.9.4 draft release
 
on:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BODY: |
            VRCAM 0.9.4 Beta のVCC / VPM配布用リリースです。
 
            - Package: com.highalte.vrcam
            - Unity: 2022.3
            - SHA-256: 84FA148D3AB6A1EC8AF88D9B1240B03049576FCF42B3BF7052756540B2A3E0D9
            - ByteLength: 222442
 
            ## 変更点
 
            - パッケージ一覧の表示が重くなる問題を修正しました。
              エディタの更新処理にかかる時間を、実測で 52.87ms から 1ms 未満へ短縮しています。
              パッケージ数が多い環境ほど効果が出ます。
            - 同梱の PRIVACY_NOTICE を更新しました。
              BOOTH検索でファイル名から作成した検索語がBOOTH側へ渡ること、
              ZIPの一時展開先、保存先へのコピー、User-Agent の送信を明記しています。
 
            ## 既知の問題
 
            - ウィンドウ右上のバージョン表記が「0.9.2 Beta」のままです。
              動作には影響しません。次のバージョンで修正します。
        run: |
          set -euo pipefail
 
          if gh api "repos/${REPOSITORY}/releases/tags/v0.9.4" >/dev/null 2>&1; then
            echo "Release v0.9.4 already exists."
            exit 1
          fi
 
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/releases" \
            -f tag_name='v0.9.4' \
            -f name='VRCAM 0.9.4 Beta (VCC / VPM)' \
            -f body="$RELEASE_BODY" \
            -F draft=true \
            -F prerelease=false
